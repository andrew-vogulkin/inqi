# SPA server for the built Vite bundle. The stock nginx image serves static files
# but 404s on client-side routes (e.g. refreshing /r/<id> or /d/<id>); this falls
# back to index.html so the router can take over. Long-cache the hashed assets.
server {
	listen 80;
	server_name _;
	root /usr/share/nginx/html;
	index index.html;

	location /assets/ {
		expires 1y;
		add_header Cache-Control "public, immutable";
		try_files $uri =404;
	}

	location / {
		try_files $uri $uri/ /index.html;
	}
}
