<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="900" viewBox="0 0 1560 900">
<defs><marker id="arr-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6B6A66"/></marker><marker id="arr-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#168F5F"/></marker><marker id="arr-i" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563EB"/></marker></defs>
<rect width="1560" height="900" fill="#FAF9F7"/>
<text x="60" y="64" font-family="Helvetica, Arial, sans-serif" font-size="30" fill="#1C1C1A" text-anchor="start" font-weight="600">inqi — main flow</text>
<text x="60" y="94" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#6B6A66" text-anchor="start">DB-versioned state machines end to end — the report lifecycle plus three child workflows, all published and diffed from the operator console</text>
<rect x="60" y="150" width="250" height="150" rx="10" fill="#EAF6EF" stroke="#168F5F" stroke-width="2"/>
<text x="80" y="188" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1C1C1A" text-anchor="start" font-weight="600">1 · Request</text>
<text x="80" y="209" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#6B6A66" text-anchor="start">web app — or plain email</text>
<text x="80" y="227" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#6B6A66" text-anchor="start">to the intake address</text>
<text x="80" y="245" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#6B6A66" text-anchor="start">ack / decline with reason</text>
<rect x="370" y="150" width="290" height="150" rx="10" fill="#FFFFFF" stroke="#E3E2DE" stroke-width="1.5"/>
<text x="390" y="188" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1C1C1A" text-anchor="start" font-weight="600">2 · Pre-research</text>
<text x="390" y="209" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#6B6A66" text-anchor="start">compliance gate · feasibility</text>
<text x="390" y="227" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#6B6A66" text-anchor="start">subject build</text>
<text x="390" y="245" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#6B6A66" text-anchor="start">optional questionnaire —</text>
<text x="390" y="263" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#6B6A66" text-anchor="start">agent asks only if needed</text>
<rect x="720" y="150" width="310" height="150" rx="10" fill="#FFFFFF" stroke="#E3E2DE" stroke-width="1.5"/>
<text x="740" y="188" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1C1C1A" text-anchor="start" font-weight="600">3 · Breadth discovery</text>
<text x="740" y="209" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#6B6A66" text-anchor="start">Qwen forms queries (bilingual)</text>
<text x="740" y="227" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#6B6A66" text-anchor="start">search → mine → qualify</text>
<text x="740" y="245" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#6B6A66" text-anchor="start">specific provider vs aggregator</text>
<text x="740" y="263" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#6B6A66" text-anchor="start">(directories inform, never count)</text>
<rect x="1090" y="150" width="250" height="150" rx="10" fill="#FFFFFF" stroke="#E3E2DE" stroke-width="1.5"/>
<text x="1110" y="188" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1C1C1A" text-anchor="start" font-weight="600">4 · Funnel</text>
<text x="1110" y="209" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#6B6A66" text-anchor="start">shortlist → inquiries</text>
<text x="1110" y="227" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#6B6A66" text-anchor="start">released in waves</text>
<text x="1110" y="245" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#6B6A66" text-anchor="start">widen on dead ends</text>
<line x1="310" y1="225" x2="370" y2="225" stroke="#168F5F" stroke-width="2" marker-end="url(#arr-b)"/>
<line x1="660" y1="225" x2="720" y2="225" stroke="#168F5F" stroke-width="2" marker-end="url(#arr-b)"/>
<line x1="1030" y1="225" x2="1090" y2="225" stroke="#168F5F" stroke-width="2" marker-end="url(#arr-b)"/>
<rect x="370" y="370" width="970" height="200" rx="10" fill="#FFFFFF" stroke="#E3E2DE" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="394" y="402" font-family="Helvetica, Arial, sans-serif" font-size="13.5" fill="#6B6A66" text-anchor="start" font-weight="600">Per supplier — in parallel</text>
<rect x="394" y="420" width="430" height="120" rx="10" fill="#FFFFFF" stroke="#E3E2DE" stroke-width="1.5"/>
<text x="414" y="458" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1C1C1A" text-anchor="start" font-weight="600">5a · Depth research</text>
<text x="414" y="479" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#6B6A66" text-anchor="start">open real pages → evidenced dossier</text>
<text x="414" y="497" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#6B6A66" text-anchor="start">evidence gate names gaps → refine cycle</text>
<text x="414" y="515" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#6B6A66" text-anchor="start">price captured WITH its unit (per m², per day)</text>
<rect x="870" y="420" width="440" height="120" rx="10" fill="#FFFFFF" stroke="#E3E2DE" stroke-width="1.5"/>
<text x="890" y="458" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1C1C1A" text-anchor="start" font-weight="600">5b · Outreach &amp; reply loop</text>
<text x="890" y="479" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#6B6A66" text-anchor="start">persona email (DKIM, per-thread routing)</text>
<text x="890" y="497" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#6B6A66" text-anchor="start">vendor reply → evaluate → follow-up</text>
<text x="890" y="515" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#6B6A66" text-anchor="start">never invents commitments · bounded turns</text>
<line x1="1215" y1="300" x2="1000" y2="370" stroke="#168F5F" stroke-width="2" marker-end="url(#arr-b)"/>
<line x1="824" y1="480" x2="870" y2="480" stroke="#6B6A66" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arr-m)"/>
<line x1="870" y1="505" x2="824" y2="505" stroke="#6B6A66" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arr-m)"/>
<text x="847" y="560" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#6B6A66" text-anchor="middle">facts flow both ways</text>
<rect x="480" y="640" width="360" height="140" rx="10" fill="#FFFFFF" stroke="#E3E2DE" stroke-width="1.5"/>
<text x="500" y="678" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1C1C1A" text-anchor="start" font-weight="600">6 · Synthesis &amp; ranking</text>
<text x="500" y="699" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#6B6A66" text-anchor="start">blended quality + price score</text>
<text x="500" y="717" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#6B6A66" text-anchor="start">evidence, quotes and caveats kept</text>
<text x="500" y="735" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#6B6A66" text-anchor="start">AI summary grounded in findings</text>
<rect x="940" y="640" width="360" height="140" rx="10" fill="#EAF6EF" stroke="#168F5F" stroke-width="2"/>
<text x="960" y="678" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1C1C1A" text-anchor="start" font-weight="600">7 · Delivered</text>
<text x="960" y="699" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#6B6A66" text-anchor="start">ranked report — live web view + email</text>
<text x="960" y="717" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#6B6A66" text-anchor="start">per-option dossier with paper trail</text>
<text x="960" y="735" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#6B6A66" text-anchor="start">pay on delivery: failed run = 0 credits</text>
<line x1="855" y1="570" x2="700" y2="640" stroke="#168F5F" stroke-width="2" marker-end="url(#arr-b)"/>
<line x1="840" y1="710" x2="940" y2="710" stroke="#168F5F" stroke-width="2" marker-end="url(#arr-b)"/>
<rect x="60" y="400" width="250" height="380" rx="10" fill="#EFF4FE" stroke="#2563EB" stroke-width="2"/>
<text x="84" y="436" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#2563EB" text-anchor="start" font-weight="600">Self-improvement</text>
<text x="84" y="470" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1C1C1A" text-anchor="start">RUN — every report</text>
<text x="84" y="492" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#6B6A66" text-anchor="start">MEASURE — scores + telemetry</text>
<text x="84" y="514" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1C1C1A" text-anchor="start">PROPOSE — new workflow</text>
<text x="84" y="536" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#6B6A66" text-anchor="start">genes (caps, waves, gates)</text>
<text x="84" y="558" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1C1C1A" text-anchor="start">REHEARSE — replayed against</text>
<text x="84" y="580" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#6B6A66" text-anchor="start">golden cassettes of real runs</text>
<text x="84" y="602" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1C1C1A" text-anchor="start">PUBLISH — auto-approve when</text>
<text x="84" y="624" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#6B6A66" text-anchor="start">it beats the incumbent</text>
<line x1="185" y1="655" x2="185" y2="685" stroke="#2563EB" stroke-width="2" marker-end="url(#arr-i)"/>
<text x="84" y="720" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#6B6A66" text-anchor="start">published version drives the</text>
<text x="84" y="738" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#6B6A66" text-anchor="start">next run — no redeploy</text>
<line x1="310" y1="590" x2="455" y2="660" stroke="#2563EB" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arr-i)"/>
<text x="382.5" y="617" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#2563EB" text-anchor="middle">new version</text>
<line x1="480" y1="700" x2="310" y2="700" stroke="#2563EB" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arr-i)"/>
<text x="395" y="716" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#2563EB" text-anchor="middle">outcomes</text>
<rect x="60" y="828" width="383.63" height="24" rx="12" fill="#EAF6EF"/>
<text x="251.815" y="844" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#0E6B46" text-anchor="middle" font-weight="600">crash-safe: leases · reaper · idempotent settlement</text>
<rect x="480" y="828" width="390.76" height="24" rx="12" fill="#EAF6EF"/>
<text x="675.38" y="844" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#0E6B46" text-anchor="middle" font-weight="600">every AI call, search &amp; email metered with its price</text>
<rect x="920" y="828" width="326.59" height="24" rx="12" fill="#EAF6EF"/>
<text x="1083.295" y="844" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#0E6B46" text-anchor="middle" font-weight="600">550+ tests incl. golden-cassette rehearsals</text>
</svg>